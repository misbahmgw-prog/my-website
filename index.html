<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luli Fashion</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f8f8f8;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .hero {
            text-align: center;
            padding: 70px 20px;
            background: #eee;
        }

        .hero h2 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        button {
            background: #111;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
        }

        .products {
            padding: 40px 20px;
            text-align: center;
        }

        .products h2 {
            margin-bottom: 30px;
        }

        .product-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .product {
            background: white;
            width: 250px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .product img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product h3 {
            margin: 15px 0 8px;
        }

        .price {
            font-weight: bold;
            margin-bottom: 12px;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Luli Fashion</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#shop">Shop</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h2>Welcome to Luli Fashion</h2>
        <p>Discover beautiful clothes for every style.</p>
        <button onclick="location.href='#shop'">Shop Now</button>
    </section>

    <section class="products" id="shop">
        <h2>Our Clothes</h2>

        <div class="product-container">

            <div class="product">
                <img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=500&q=80" alt="Elegant Dress">
                <h3>Elegant Dress</h3>
                <p class="price">1,500 ETB</p>
                <button>Buy Now</button>
            </div>

            <div class="product">
                <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=500&q=80" alt="Fashion Outfit">
                <h3>Fashion Outfit</h3>
                <p class="price">2,000 ETB</p>
                <button>Buy Now</button>
            </div>

            <div class="product">
                <img src="https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=500&q=80" alt="Casual Style">
                <h3>Casual Style</h3>
                <p class="price">1,200 ETB</p>
                <button>Buy Now</button>
            </div>

        </div>
    </section>

    <footer id="contact">
        <p>© 2026 Luli Fashion</p>
        <p>Contact us: +251 900 000 000</p>
    </footer>

</body>
</html>
